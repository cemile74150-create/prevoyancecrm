# Stack locale compatible Infomaniak pour valider migration (Postgres + MinIO S3)
# Usage:
#   docker compose -f deploy/infomaniak/docker-compose.staging.yml up -d
# Puis pointer .env.infomaniak vers ces services pour un dry-run.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prevoyance
      POSTGRES_PASSWORD: prevoyance
      POSTGRES_DB: prevoyancecrm
    ports:
      - "5433:5432"
    volumes:
      - ik_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prevoyance -d prevoyancecrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ik_minio_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/prevoyance-crm-docs || true;
      mc anonymous set none local/prevoyance-crm-docs;
      exit 0;
      "

volumes:
  ik_pg_data:
  ik_minio_data:
