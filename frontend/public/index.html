<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#002FA7" />
        <meta name="description" content="LeoSoft — CRM de gestion pour conseillers." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>LeoSoft</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script>
          // After deploy, a cached index.html may reference deleted JS chunks → blank page on refresh.
          window.addEventListener("error", function (e) {
            var msg = (e && (e.message || (e.error && e.error.message))) || "";
            if (!/Loading chunk|ChunkLoadError|Failed to fetch dynamically imported module/i.test(msg)) return;
            var key = "spa-chunk-reload";
            if (sessionStorage.getItem(key)) return;
            sessionStorage.setItem(key, "1");
            window.location.reload(true);
          });
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
