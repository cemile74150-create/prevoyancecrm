# CI LeoSoft — tests automatiques, aucun déploiement.
# Déclenché sur PR vers develop/main et push sur develop.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (no prod secrets)
        env:
          # Valeurs fictives uniquement — jamais de secrets prod
          ACCESS_MODE: legacy
          TENANT_USER_ID: ci-test
        run: |
          # Sous-ensemble stable sur main (pas de Mongo/S3/SMTP prod).
          # Étendre la liste au fil des merges develop sans casser CI.
          pytest -n 0 \
            tests/test_email_service_config.py \
            tests/test_email_headers.py \
            tests/test_backup_retention.py \
            tests/test_client_identity.py \
            tests/test_analyse_summary.py

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          CI: "true"
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build

  no-deploy:
    name: guard-no-railway-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Refuse accidental deploy scripts in CI
        run: |
          echo "CI LeoSoft: aucun railway up, aucune variable prod."
          echo "Déploiement production = GO hebdomadaire explicite hors CI."
